name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache only the pip wheel/download cache (keyed on the dependency spec),
      # not the installed environment. Wheels for the heavy deps (pandas, bokeh,
      # scipy, cutadapt) are reused, but the package itself is always installed
      # fresh, so a stale editable install can never carry between runs.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
